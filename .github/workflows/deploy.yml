name: Deploy to GitHub Pages test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Perform tasks inside DevContainer
      uses: devcontainers/ci@v0.3
      with:
        noCache: true
        configFile: .github/workflows/devcontainer.json
        imageName: pkm
        runCmd: |
          set -e
    
          echo "[INFO] DevContainer Ready"
          
          echo "[INFO] Running tasks to test, generate coverage report and build"
          if ! task build:all; then
            echo "[ERROR] Failed to properly run the tasks"
            exit 1
          fi

    - name: Deploy
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./build
        publish_branch: gh-pages