version: 3

silent: true

tasks:
  all:
    desc: Clean build for website
    cmds:
    - task: clean
    - task: build

  build:
    desc: Build Website
    cmds:
    - echo "[INFO] Installing Dependencies for portfolio"
    - npm i
    - echo "[INFO] Building Portfolio (serves /)"
    - npm run prod
    
  clean:
    desc: Clean previous builds
    cmds: 
    - echo "[INFO] Removing build/"
    - rm -rf build/